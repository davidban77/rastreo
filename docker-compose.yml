networks:
  rastreo-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.50.0.0/24

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: rastreo-kafka
    ports:
      - "9092:9092"
    networks:
      rastreo-net:
        ipv4_address: 10.50.0.2
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  nats:
    image: nats:2.14-alpine
    container_name: rastreo-nats
    command:
      - "-js"
      - "-m"
      - "8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      rastreo-net:
        ipv4_address: 10.50.0.4
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/varz"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

  # No healthcheck: scratch image has no shell. Use host curl on localhost:8080/health instead.
  rastreo-server:
    build: .
    container_name: rastreo-server
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      rastreo-net:
        ipv4_address: 10.50.0.3
    cap_add:
      - NET_RAW
    environment:
      RASTREO_SERVER_PORT: "8080"
      RASTREO_SERVER_BIND: "0.0.0.0"
      RASTREO_AUTH_DISABLED: "true"

  target-1:
    image: nginx:1.31-alpine
    container_name: rastreo-target-1
    networks:
      rastreo-net:
        ipv4_address: 10.50.0.10
    expose:
      - "80"

  target-2:
    image: nginx:1.31-alpine
    container_name: rastreo-target-2
    networks:
      rastreo-net:
        ipv4_address: 10.50.0.11
    expose:
      - "80"

  target-3:
    image: nginx:1.31-alpine
    container_name: rastreo-target-3
    networks:
      rastreo-net:
        ipv4_address: 10.50.0.12
    expose:
      - "80"

  target-ssh:
    image: linuxserver/openssh-server:10.2_p1-r0-ls229
    container_name: rastreo-target-ssh
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PASSWORD_ACCESS=false
      - USER_NAME=rastreo-uat
    networks:
      rastreo-net:
        ipv4_address: 10.50.0.20
    expose:
      - "2222"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "2222"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  target-tls:
    image: nginx:1.31-alpine
    container_name: rastreo-target-tls
    entrypoint: /entrypoint.sh
    volumes:
      - ./docker/target-tls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/target-tls/entrypoint.sh:/entrypoint.sh:ro
    networks:
      rastreo-net:
        ipv4_address: 10.50.0.30
    expose:
      - "443"
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /etc/nginx/certs/server.crt"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
