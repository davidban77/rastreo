# Infrahub SoT + consumer stack for Phase 5 validation.
#
# Prerequisites (from parent lab-srlinux/ directory):
#   1. containerlab topology:  sudo containerlab deploy -t lab.clab.yml
#   2. shared Kafka broker:    docker compose -f kafka/docker-compose.yml up -d
#
# Then from THIS directory:  docker compose up -d
# Wait for infrahub to become healthy (first boot ~5 min for schema init),
# then run ./bootstrap.sh to load the RastreoDevice schema.
#
# Infrahub is heavier than Nautobot/NetBox: memgraph (graph DB) + rabbitmq
# (task queue) + redis (cache) + infrahub-server (API/GraphQL) +
# infrahub-git (git task worker). Config via env vars matches the
# OpsMill reference deployment.

networks:
  rastreo-lab:
    external: true

services:
  memgraph:
    image: memgraph/memgraph-mage:latest
    container_name: rastreo-lab-infrahub-memgraph
    command:
      - --storage-mode=IN_MEMORY_TRANSACTIONAL
      - --storage-snapshot-interval-sec=300
      - --storage-wal-enabled=true
      - --log-level=WARNING
      - --also-log-to-stderr
      - --telemetry-enabled=false
    networks:
      - rastreo-lab
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 0;' | mgconsole || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rastreo-lab-infrahub-rabbitmq
    networks:
      - rastreo-lab
    environment:
      RABBITMQ_DEFAULT_USER: infrahub
      RABBITMQ_DEFAULT_PASS: infrahub
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: rastreo-lab-infrahub-redis
    networks:
      - rastreo-lab
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 6

  infrahub-server:
    image: registry.opsmill.io/opsmill/infrahub:1.3
    container_name: rastreo-lab-infrahub
    depends_on:
      memgraph:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8082:8000"
    networks:
      - rastreo-lab
    command: ["gunicorn", "--config", "backend/infrahub/api/gunicorn_config.py", "--logger-class=infrahub.serve.log.GunicornLogger", "infrahub.server:app"]
    environment:
      INFRAHUB_DB_TYPE: memgraph
      INFRAHUB_DB_ADDRESS: memgraph
      INFRAHUB_BROKER_ADDRESS: rabbitmq
      INFRAHUB_BROKER_USERNAME: infrahub
      INFRAHUB_BROKER_PASSWORD: infrahub
      INFRAHUB_CACHE_ADDRESS: redis
      INFRAHUB_INITIAL_ADMIN_TOKEN: "06438eb2-8019-4776-878c-0941b1f1d1ec"
      INFRAHUB_PRODUCTION: "false"
      INFRAHUB_LOG_LEVEL: WARNING
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/schema/summary > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  infrahub-tasks:
    image: registry.opsmill.io/opsmill/infrahub:1.3
    container_name: rastreo-lab-infrahub-tasks
    command: ["infrahub", "git-agent", "start", "--debug"]
    depends_on:
      infrahub-server:
        condition: service_healthy
    networks:
      - rastreo-lab
    environment:
      INFRAHUB_ADDRESS: "http://infrahub-server:8000"
      INFRAHUB_DB_TYPE: memgraph
      INFRAHUB_DB_ADDRESS: memgraph
      INFRAHUB_BROKER_ADDRESS: rabbitmq
      INFRAHUB_BROKER_USERNAME: infrahub
      INFRAHUB_BROKER_PASSWORD: infrahub
      INFRAHUB_CACHE_ADDRESS: redis
      INFRAHUB_INITIAL_AGENT_TOKEN: "06438eb2-8019-4776-878c-0941b1f1d1ec"

  infrahub-consumer:
    build:
      context: ../../../examples/infrahub-consumer
    container_name: rastreo-lab-infrahub-consumer
    depends_on:
      infrahub-server:
        condition: service_healthy
    networks:
      - rastreo-lab
    environment:
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC: "rastreo.devices"
      KAFKA_GROUP_ID: "rastreo-lab-infrahub-consumer"
      KAFKA_AUTO_OFFSET_RESET: earliest
      INFRAHUB_URL: "http://infrahub-server:8000"
      INFRAHUB_TOKEN: "06438eb2-8019-4776-878c-0941b1f1d1ec"
      INFRAHUB_BRANCH: "rastreo-updates"
      INFRAHUB_AUTO_MERGE: "true"
      LOG_LEVEL: INFO
