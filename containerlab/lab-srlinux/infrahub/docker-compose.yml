# Infrahub SoT + consumer stack for Phase 5 validation.
#
# Config shape adapted from the network-observability/workshops autocon5
# lab, which is a known-working Infrahub 1.x reference deployment.
#
# Prerequisites (from parent lab-srlinux/ directory):
#   1. containerlab topology:  sudo containerlab deploy -t lab.clab.yml
#   2. shared Kafka broker:    docker compose -f kafka/docker-compose.yml up -d
#
# Then from THIS directory:  docker compose up -d
# Wait for infrahub-server to become healthy (first boot ~2-3 min), then
# run ./bootstrap.sh to load the RastreoDevice schema.

networks:
  rastreo-lab:
    external: true

services:
  infrahub-db:
    image: neo4j:5-community
    container_name: rastreo-lab-infrahub-db
    networks:
      - rastreo-lab
    environment:
      NEO4J_AUTH: neo4j/admin
      NEO4J_dbms_security_auth__minimum__password__length: "4"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  infrahub-cache:
    image: redis:7.2
    container_name: rastreo-lab-infrahub-cache
    networks:
      - rastreo-lab

  infrahub-message-queue:
    image: rabbitmq:3.13-management-alpine
    container_name: rastreo-lab-infrahub-mq
    networks:
      - rastreo-lab
    environment:
      RABBITMQ_DEFAULT_USER: infrahub
      RABBITMQ_DEFAULT_PASS: infrahub
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 30s
      retries: 5

  infrahub-server:
    image: registry.opsmill.io/opsmill/infrahub:1.5
    container_name: rastreo-lab-infrahub
    depends_on:
      infrahub-db:
        condition: service_healthy
      infrahub-cache:
        condition: service_started
      infrahub-message-queue:
        condition: service_healthy
    ports:
      - "8082:8000"
    networks:
      - rastreo-lab
    command: ["gunicorn", "--config", "backend/infrahub/serve/gunicorn_config.py", "--logger-class", "infrahub.serve.log.GunicornLogger", "-w", "2", "infrahub.server:app"]
    environment:
      INFRAHUB_PRODUCTION: "true"
      INFRAHUB_WORKFLOW_DRIVER: local
      INFRAHUB_INITIAL_ADMIN_TOKEN: "06438eb2-8019-4776-878c-0941b1f1d1ec"
      INFRAHUB_INITIAL_AGENT_TOKEN: "a4f3c1d2-9b8e-4a7f-8c5d-1e2f3a4b5c6d"
      INFRAHUB_SECURITY_SECRET_KEY: "327f747f-efac-42be-9e73-999f08f86b92"
      INFRAHUB_DB_TYPE: neo4j
      INFRAHUB_DB_ADDRESS: infrahub-db
      INFRAHUB_DB_PORT: "7687"
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: admin
      INFRAHUB_BROKER_ADDRESS: infrahub-message-queue
      INFRAHUB_BROKER_USERNAME: infrahub
      INFRAHUB_BROKER_PASSWORD: infrahub
      INFRAHUB_CACHE_ADDRESS: infrahub-cache
      INFRAHUB_LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/schema/summary > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  infrahub-task-worker:
    image: registry.opsmill.io/opsmill/infrahub:1.5
    container_name: rastreo-lab-infrahub-tasks
    command: ["infrahub", "git-agent", "start"]
    depends_on:
      infrahub-server:
        condition: service_started
      infrahub-message-queue:
        condition: service_healthy
    networks:
      - rastreo-lab
    environment:
      INFRAHUB_PRODUCTION: "true"
      INFRAHUB_WORKFLOW_DRIVER: local
      INFRAHUB_DB_TYPE: neo4j
      INFRAHUB_DB_ADDRESS: infrahub-db
      INFRAHUB_DB_PORT: "7687"
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: admin
      INFRAHUB_BROKER_ADDRESS: infrahub-message-queue
      INFRAHUB_BROKER_USERNAME: infrahub
      INFRAHUB_BROKER_PASSWORD: infrahub
      INFRAHUB_CACHE_ADDRESS: infrahub-cache
      INFRAHUB_INTERNAL_ADDRESS: "http://infrahub-server:8000"
      INFRAHUB_API_TOKEN: "06438eb2-8019-4776-878c-0941b1f1d1ec"

  infrahub-consumer:
    build:
      context: ../../../examples/infrahub-consumer
    container_name: rastreo-lab-infrahub-consumer
    depends_on:
      infrahub-server:
        condition: service_healthy
    networks:
      - rastreo-lab
    environment:
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC: "rastreo.devices"
      KAFKA_GROUP_ID: "rastreo-lab-infrahub-consumer"
      KAFKA_AUTO_OFFSET_RESET: earliest
      INFRAHUB_URL: "http://infrahub-server:8000"
      INFRAHUB_TOKEN: "06438eb2-8019-4776-878c-0941b1f1d1ec"
      INFRAHUB_BRANCH: "main"
      INFRAHUB_AUTO_MERGE: "true"
      LOG_LEVEL: INFO
