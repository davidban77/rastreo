# Default values for rastreo Helm chart.

# Number of replicas for the rastreo-server Deployment.
replicaCount: 1

image:
  # Container image repository.
  repository: ghcr.io/davidban77/rastreo
  # Image pull policy.
  pullPolicy: IfNotPresent
  # Image tag — defaults to the chart appVersion if not set.
  tag: ""

# Image pull secrets for private registries.
imagePullSecrets: []

# Override the chart name used in resource names.
nameOverride: ""
# Override the full resource name (release-chart).
fullnameOverride: ""

server:
  # Port the rastreo-server listens on inside the container.
  port: 8080
  # Bind address for the rastreo-server.
  bind: "0.0.0.0"
  # Byte cap on the POST /scans response capture (RASTREO_MAX_RESULT_BYTES). A scan
  # producing more still completes; the response carries the records that fit plus
  # `truncated: true` and the true total, and any server-configured sink still gets
  # every record. Peak memory is ~3x this value, so the 32 MiB default fits inside
  # resources.limits.memory (256Mi) below — raise both together if you raise this.
  maxResultBytes: 33554432

# Bearer-token auth for POST /scans. Health, readiness, and metrics are never
# authenticated. Secure by default: with enabled=true the chart refuses to render
# unless a token source is set. To run unauthenticated (NOT recommended), set
# enabled=false — the pod then starts with RASTREO_AUTH_DISABLED=true.
auth:
  enabled: true
  # Inline secret. When set (and existingSecret is empty) the chart renders a
  # Secret holding it. Prefer existingSecret in production so the token never
  # lives in values.
  token: ""
  # Name of a pre-existing Secret holding the token. Takes precedence over token.
  existingSecret: ""
  # Key within the Secret that holds the token value.
  secretKey: "api-token"

# ServiceAccount for the pod. Token automounting is disabled — the server never
# calls the Kubernetes API.
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Defense-in-depth L3/L4 ingress isolation. Off by default: a default-deny policy
# is topology-specific and, in an enforcing CNI with no configured sources, would
# lock out all access. Enable and configure the peers for your cluster. With
# enabled=true and both lists empty, the policy denies all ingress.
networkPolicy:
  enabled: false
  # Peers allowed to reach the API port. Each entry is a NetworkPolicyPeer
  # (namespaceSelector and/or podSelector).
  ingress: []
  # Peers allowed to scrape /metrics (e.g. the monitoring namespace). Each entry
  # is a NetworkPolicyPeer. NOTE: kubelet liveness/readiness probes originate from
  # the node, not a pod/namespace, so a selector here does NOT admit them. On an
  # enforcing CNI that gates host traffic, also permit the node (e.g. an ipBlock
  # for the node/pod CIDR) or the probes fail and the pod CrashLoops.
  monitoring: []

# Time the kubelet waits between SIGTERM and SIGKILL. Must exceed the longest
# expected in-flight scan so `axum` can drain requests before the process is
# killed. Default sizing: `--request-timeout-ms` (60s) + probe drain (5s) +
# margin.
terminationGracePeriodSeconds: 75

# Readiness gate configuration for /readyz. Leave a key unset to inherit the
# server's built-in default (100 inflight, 30s sink quarantine, 30s scan
# quarantine). Set any value to 0 to disable that check entirely.
readiness: {}
  # maxInflightScans: 100
  # sinkErrorQuarantineSeconds: 30
  # scanErrorQuarantineSeconds: 30

# Server-side sink reachability probe. When `sink.config` is set the chart
# renders a ConfigMap containing the YAML, mounts it at /etc/rastreo/sink/sink.yaml,
# and the server periodically probes the resulting sink. `/readyz` reports the
# cached result on `sink_reachable`, whether the sink is attached at all on
# `sink_attached`, and gates on `sink_unreachable` — plus `sink_probe_stalled`
# when the probe task has stopped running and the cached result can no longer be
# trusted. `/metrics` exposes `rastreo_server_sink_reachable{sink_type}`,
# `rastreo_server_sink_reachability_probe_total{outcome,sink_type}`, and
# `rastreo_server_sink_probe_ticks_total{sink_type}`, whose flatline is the
# alertable form of `sink_probe_stalled`. Leave `sink.config` empty (default) to
# run without a server-configured sink — the reachability axis reports null and
# does not gate `/readyz`.
sink:
  # SinkConfig YAML — mirrors the shape of the `sink:` field in a scenario file.
  # Example:
  #   sink:
  #     config:
  #       type: kafka
  #       brokers: ["kafka.observability.svc:9092"]
  #       topic: rastreo.discovery.records.v1
  config: {}
  # The same document as a verbatim string, for a config Helm must not parse.
  # Helm strips a `!file` tag out of `config` above before any template runs and
  # leaves the path behind as a plain string, which the server then reads as the
  # credential itself. A document written here reaches the ConfigMap character
  # for character, so the tag survives and the server reads the mounted file.
  # Mutually exclusive with `config` — setting both fails the render.
  # Example:
  #   sink:
  #     configYaml: |
  #       type: kafka
  #       brokers: ["kafka.observability.svc:9092"]
  #       topic: rastreo.discovery.records.v1
  #       sasl:
  #         mechanism: scram_sha_512
  #         username: rastreo
  #         password: !file /run/secrets/kafka/password
  configYaml: ""
  # Probe cadence in seconds. Clamped to a minimum of 1s.
  probeIntervalSeconds: 10
  # Per-probe timeout in seconds. Elapsed probes count as failure. Clamped to a
  # minimum of 1s.
  probeTimeoutSeconds: 5

# Metric label cardinality guard for the `scenario` dimension on
# `rastreo_server_scan_duration_seconds`. Any scenario name outside the
# allow-list falls into the shared `other` bucket. Empty allow-list (default)
# means every scan bucket into `_all` and `other` only — no per-scenario
# breakdown. Add names one per line to opt those scenarios into a labeled
# series; keep the list short (a handful at most) to bound Prometheus
# cardinality.
metrics:
  scenarioAllowlist: []
  scenarioMaxLength: 64

# SSRF / DoS guards for POST /scans. The allow-list is opt-in: an empty list
# (default) renders no RASTREO_TARGET_ALLOWLIST, so every resolved target is
# allowed. Populate it with CIDRs (or bare IPs, which become /32 or /128 host
# nets) to reject any scan whose resolved targets fall outside the listed ranges
# — the whole request is refused with 403 and nothing is probed. maxTotalHosts
# caps the total resolved hosts across all targets in one request (0 disables);
# a scan over the cap is rejected with 400. maxBodyBytes bounds the request body
# size; a larger body is rejected with 413 before JSON parsing.
targetGuard:
  allowlist: []
  maxTotalHosts: 262144
  maxBodyBytes: 1048576

# Log line format on stderr. `text` (default) is human-readable; `json` emits
# one JSON object per line for Loki / ELK / Splunk ingestion. Leave null to
# inherit the binary default (text); set to `text` or `json` to render
# RASTREO_LOG_FORMAT on the container.
logFormat: null

# OpenTelemetry OTLP export for metrics, logs, and traces. Requires the `-otlp` image
# variant (ghcr.io/davidban77/rastreo:<TAG>-otlp) — the default image does
# not include `--features otlp`. Off by default; enable when your observability
# stack accepts OTLP over gRPC or HTTP+protobuf.
otlp:
  # OTLP collector endpoint. Required when metricsEnabled, logsEnabled, or
  # tracesEnabled is true. Format depends on `protocol`:
  #  - `grpc` (default): "http://otel-collector.observability.svc:4317"
  #  - `http-protobuf`:  "http://otel-collector.observability.svc:4318"
  # On http-protobuf, rastreo appends `/v1/metrics`, `/v1/logs`, and `/v1/traces` per signal,
  # so a single base URL works for both. Pass a fully-qualified URL only when
  # your collector is on a non-standard route.
  endpoint: ""
  # OTLP transport protocol. `grpc` (default) targets a collector's gRPC
  # endpoint (typically port 4317). `http-protobuf` targets the HTTP+protobuf
  # endpoint (typically port 4318). Choose based on your collector's ingress
  # configuration; some deployments block gRPC or run behind an HTTPS-only
  # ingress that only forwards HTTP.
  protocol: grpc
  # Enable metrics export via OTLP.
  metricsEnabled: false
  # Enable logs export via OTLP.
  logsEnabled: false
  # Enable traces export via OTLP (root scan span with resolve/stream/finish stages).
  tracesEnabled: false
  # Periodic metrics export interval in seconds.
  metricsIntervalSeconds: 30
  # Resource `service.name` attribute on exported signals.
  serviceName: "rastreo-server"
  # Custom headers attached to every OTLP export (metrics, logs, traces) over both
  # gRPC and HTTP+protobuf — used to authenticate to hosted collectors (Grafana
  # Cloud, Honeycomb, etc.). OTel format: comma-separated `key=value` pairs, e.g.
  # "authorization=Bearer <token>,x-scope-orgid=<tenant>". Header names are
  # lowercased; values are secrets. Commas separating multiple headers must be
  # escaped (\,) when passing via `--set`, or use a values file with `-f` instead.
  # When set (and headersExistingSecret is empty) the chart renders a Secret holding
  # the whole string. Prefer headersExistingSecret in production so the token never
  # lives in values.
  headers: ""
  # Name of a pre-existing Secret holding the headers string. Takes precedence over headers.
  headersExistingSecret: ""
  # Key within the Secret that holds the headers value.
  headersSecretKey: "otlp-headers"

service:
  # Kubernetes Service type.
  type: ClusterIP
  # Service port (maps to server.port on the container).
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Extra environment variables on the container, as Kubernetes EnvVar entries.
# The server expands `${VAR}` when it reads the sink config, so a broker
# credential can stay in a Secret and be named here instead of written into the
# sink config. Without an entry the reference has nothing to resolve against and
# the pod never becomes ready. An entry that repeats a variable the chart
# already sets fails the render: Kubernetes keeps the last duplicate, so the
# override would be silent.
extraEnv: []
#  - name: KAFKA_PASSWORD
#    valueFrom:
#      secretKeyRef:
#        name: rastreo-kafka
#        key: password

# Extra envFrom sources on the container, as Kubernetes EnvFromSource entries.
# Each key in the referenced Secret or ConfigMap becomes an environment variable
# as long as the key is a valid variable name ([A-Za-z_][A-Za-z0-9_]*):
# Kubernetes skips a key like kafka-password and reports it only in a pod event,
# leaving the reference in the sink config with nothing to resolve against. An
# explicit env entry wins over an envFrom key of the same name, so these cannot
# shadow what the chart sets and are not checked for collisions.
extraEnvFrom: []
#  - secretRef:
#      name: rastreo-kafka

# Extra volumes on the pod. Mount a Secret here to reach it with a `!file` tag
# in `sink.configYaml`. The name `sink-config` is reserved for the chart's own
# ConfigMap volume.
extraVolumes: []
#  - name: kafka-credentials
#    secret:
#      secretName: rastreo-kafka

# Extra volume mounts on the container. Read-only mounts work as-is under the
# hardened default securityContext — no capability and no writable root needed.
# A mount that overlaps /etc/rastreo/sink fails the render: it would hide the
# sink config the chart mounts there. A mount whose name matches no volume fails
# the render too — Kubernetes would reject the pod on apply, after a clean
# render, and the mounted Secret would never reach the container.
extraVolumeMounts: []
#  - name: kafka-credentials
#    mountPath: /run/secrets/kafka
#    readOnly: true

# Pod-level security context. Defaults match the non-root image (UID 65532).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container-level security context. Defaults match the non-root image (UID 65532).
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Opt-in Linux capabilities. Off by default. The default deploy runs fully
# hardened (non-root, drop ALL) and needs no capability: the binaries carry
# CAP_NET_RAW as a permitted-only file capability and raise it in-process, so
# they exec cleanly under a restricted securityContext instead of crash-looping.
podSecurity:
  # Adds NET_RAW to the container so the ARP, NDP, and ICMP (SOCK_RAW fallback)
  # probers can open raw sockets, while keeping the pod non-root and hardened.
  # Enable only for scenarios that use `type: arp`, `type: ndp`, or `type: icmp`.
  # Without it, those probers record a clean fault and the scan continues
  # (exit 0) — they do not crash.
  netRaw: false

# Horizontal Pod Autoscaler configuration.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget configuration.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# PrometheusRule alerts for rastreo-server.
# Requires the Prometheus Operator CRD `monitoring.coreos.com/v1` in the cluster.
# Off by default — enable when your monitoring stack is ready to page on rastreo.
alerts:
  # Deploy the PrometheusRule resource.
  enabled: false
  # Extra labels merged onto the PrometheusRule metadata.
  # Prometheus Operator's ruleSelector typically matches on a `release` or
  # `role: alert-rules` label; add whatever your Operator selects here.
  additionalLabels: {}
  # Threshold for the RastreoBuildOld alert: number of seconds a single pod may
  # have been running the same build before we page.
  # Default 30 days = 2592000 seconds.
  buildAgeThresholdSeconds: 2592000

# Ingress configuration.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: rastreo.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ServiceMonitor for Prometheus Operator.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  path: "/metrics"
  additionalLabels: {}

# Grafana dashboard delivery.
# Deploys a labeled ConfigMap the Grafana sidecar auto-discovers.
grafana:
  # Deploy the dashboard ConfigMap.
  dashboardsEnabled: false
  # Label the ConfigMap so the Grafana sidecar picks it up.
  # Default matches the Grafana chart's convention (`grafana_dashboard: "1"`);
  # override if your Grafana chart uses a different sidecar label.
  dashboardLabel:
    name: grafana_dashboard
    value: "1"

# Node selector for pod scheduling.
nodeSelector: {}

# Tolerations for pod scheduling.
tolerations: []

# Affinity rules for pod scheduling.
affinity: {}
