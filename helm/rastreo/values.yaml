# Default values for rastreo Helm chart.

# Number of replicas for the rastreo-server Deployment.
replicaCount: 1

image:
  # Container image repository.
  repository: ghcr.io/davidban77/rastreo
  # Image pull policy.
  pullPolicy: IfNotPresent
  # Image tag — defaults to the chart appVersion if not set.
  tag: ""

# Image pull secrets for private registries.
imagePullSecrets: []

# Override the chart name used in resource names.
nameOverride: ""
# Override the full resource name (release-chart).
fullnameOverride: ""

server:
  # Port the rastreo-server listens on inside the container.
  port: 8080
  # Bind address for the rastreo-server.
  bind: "0.0.0.0"

# Readiness gate configuration for /readyz. Leave a key unset to inherit the
# server's built-in default (100 inflight, 30s sink quarantine, 30s scan
# quarantine). Set any value to 0 to disable that check entirely.
readiness: {}
  # maxInflightScans: 100
  # sinkErrorQuarantineSeconds: 30
  # scanErrorQuarantineSeconds: 30

# Log line format on stderr. `text` (default) is human-readable; `json` emits
# one JSON object per line for Loki / ELK / Splunk ingestion. Leave null to
# inherit the binary default (text); set to `text` or `json` to render
# RASTREO_LOG_FORMAT on the container.
logFormat: null

# OpenTelemetry OTLP export for metrics and logs. Requires building the
# server with `--features otlp` — the default binary does not include OTLP
# support. Off by default; enable when your observability stack accepts
# OTLP over gRPC.
otlp:
  # OTLP gRPC endpoint (default port 4317). Required when either
  # metricsEnabled or logsEnabled is true.
  # Example: "http://otel-collector.observability.svc:4317"
  endpoint: ""
  # Enable metrics export via OTLP.
  metricsEnabled: false
  # Enable logs export via OTLP.
  logsEnabled: false
  # Periodic metrics export interval in seconds.
  metricsIntervalSeconds: 30
  # Resource `service.name` attribute on exported signals.
  serviceName: "rastreo-server"

service:
  # Kubernetes Service type.
  type: ClusterIP
  # Service port (maps to server.port on the container).
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Pod-level security context. Defaults match the non-root image (UID 65532).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container-level security context. Defaults match the non-root image (UID 65532).
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Opt-in Linux capabilities. Off by default because many clusters disallow
# capability additions (Pod Security Standards `restricted`).
podSecurity:
  # Grants NET_RAW to the container. Required for the ARP and NDP probers,
  # which open AF_PACKET raw sockets to send Ethernet frames directly, and ICMP
  # (SOCK_RAW fallback path). Only enable when the operator submits scenarios
  # that use `type: arp`, `type: ndp`, or `type: icmp` on a Linux host where the
  # unprivileged ping-socket path is unavailable.
  netRaw: false

# Optional inline configuration mounted at /etc/rastreo as a ConfigMap.
# Each key becomes a file under the mount path. Leave empty to skip the ConfigMap.
# Example:
#   config:
#     rastreo.yaml: |
#       targets:
#         - 10.0.0.0/24
config: {}

# Horizontal Pod Autoscaler configuration.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget configuration.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# PrometheusRule alerts for rastreo-server.
# Requires the Prometheus Operator CRD `monitoring.coreos.com/v1` in the cluster.
# Off by default — enable when your monitoring stack is ready to page on rastreo.
alerts:
  # Deploy the PrometheusRule resource.
  enabled: false
  # Extra labels merged onto the PrometheusRule metadata.
  # Prometheus Operator's ruleSelector typically matches on a `release` or
  # `role: alert-rules` label; add whatever your Operator selects here.
  additionalLabels: {}
  # Threshold for the RastreoBuildOld alert: number of seconds a single pod may
  # have been running the same build before we page.
  # Default 30 days = 2592000 seconds.
  buildAgeThresholdSeconds: 2592000

# Ingress configuration.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: rastreo.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ServiceMonitor for Prometheus Operator.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  path: "/metrics"
  additionalLabels: {}

# Grafana dashboard delivery.
# Deploys a labeled ConfigMap the Grafana sidecar auto-discovers.
grafana:
  # Deploy the dashboard ConfigMap.
  dashboardsEnabled: false
  # Label the ConfigMap so the Grafana sidecar picks it up.
  # Default matches the Grafana chart's convention (`grafana_dashboard: "1"`);
  # override if your Grafana chart uses a different sidecar label.
  dashboardLabel:
    name: grafana_dashboard
    value: "1"

# Node selector for pod scheduling.
nodeSelector: {}

# Tolerations for pod scheduling.
tolerations: []

# Affinity rules for pod scheduling.
affinity: {}
