{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rastreo.fullname" . }}
  labels:
    {{- include "rastreo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rastreo.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- with .Values.networkPolicy.ingress }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $.Values.server.port }}
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.monitoring }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $.Values.server.port }}
          protocol: TCP
    {{- end }}
{{- end }}
