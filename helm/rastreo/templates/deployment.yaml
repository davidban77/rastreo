apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rastreo.fullname" . }}
  labels:
    {{- include "rastreo.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rastreo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rastreo.selectorLabels" . | nindent 8 }}
      {{- if and .Values.sink .Values.sink.config }}
      annotations:
        checksum/sink-config: {{ include (print $.Template.BasePath "/configmap-sink.yaml") . | sha256sum }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "rastreo.serviceAccountName" . }}
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "rastreo.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.securityContext }}
          securityContext:
            {{- $ctx := deepCopy .Values.securityContext }}
            {{- if .Values.podSecurity.netRaw }}
            {{- $caps := (get $ctx "capabilities") | default (dict) }}
            {{- $add := (get $caps "add") | default (list) }}
            {{- $_ := set $caps "add" (append $add "NET_RAW") }}
            {{- $_ := set $ctx "capabilities" $caps }}
            {{- end }}
            {{- toYaml $ctx | nindent 12 }}
          {{- end }}
          args:
            - "--port"
            - {{ .Values.server.port | quote }}
            - "--bind"
            - {{ .Values.server.bind | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          {{- $envs := list }}
          {{- if hasKey .Values.server "maxResultBytes" }}
          {{- $envs = append $envs (dict "name" "RASTREO_MAX_RESULT_BYTES" "value" (printf "%d" (int64 .Values.server.maxResultBytes))) }}
          {{- end }}
          {{- if hasKey .Values.readiness "maxInflightScans" }}
          {{- $envs = append $envs (dict "name" "RASTREO_MAX_INFLIGHT_SCANS" "value" (printf "%d" (int64 .Values.readiness.maxInflightScans))) }}
          {{- end }}
          {{- if hasKey .Values.readiness "sinkErrorQuarantineSeconds" }}
          {{- $envs = append $envs (dict "name" "RASTREO_SINK_ERROR_QUARANTINE_SECS" "value" (printf "%d" (int64 .Values.readiness.sinkErrorQuarantineSeconds))) }}
          {{- end }}
          {{- if hasKey .Values.readiness "scanErrorQuarantineSeconds" }}
          {{- $envs = append $envs (dict "name" "RASTREO_SCAN_ERROR_QUARANTINE_SECS" "value" (printf "%d" (int64 .Values.readiness.scanErrorQuarantineSeconds))) }}
          {{- end }}
          {{- if .Values.logFormat }}
          {{- $envs = append $envs (dict "name" "RASTREO_LOG_FORMAT" "value" (printf "%v" .Values.logFormat)) }}
          {{- end }}
          {{- if .Values.metrics }}
          {{- if and .Values.metrics.scenarioAllowlist (gt (len .Values.metrics.scenarioAllowlist) 0) }}
          {{- $envs = append $envs (dict "name" "RASTREO_SCENARIO_LABEL_ALLOWLIST" "value" (join "," .Values.metrics.scenarioAllowlist)) }}
          {{- end }}
          {{- if hasKey .Values.metrics "scenarioMaxLength" }}
          {{- $envs = append $envs (dict "name" "RASTREO_SCENARIO_LABEL_MAX_LENGTH" "value" (printf "%d" (int64 .Values.metrics.scenarioMaxLength))) }}
          {{- end }}
          {{- end }}
          {{- if .Values.targetGuard }}
          {{- if and .Values.targetGuard.allowlist (gt (len .Values.targetGuard.allowlist) 0) }}
          {{- $envs = append $envs (dict "name" "RASTREO_TARGET_ALLOWLIST" "value" (join "," .Values.targetGuard.allowlist)) }}
          {{- end }}
          {{- if hasKey .Values.targetGuard "maxTotalHosts" }}
          {{- $envs = append $envs (dict "name" "RASTREO_MAX_TOTAL_HOSTS" "value" (printf "%d" (int64 .Values.targetGuard.maxTotalHosts))) }}
          {{- end }}
          {{- if hasKey .Values.targetGuard "maxBodyBytes" }}
          {{- $envs = append $envs (dict "name" "RASTREO_MAX_BODY_BYTES" "value" (printf "%d" (int64 .Values.targetGuard.maxBodyBytes))) }}
          {{- end }}
          {{- end }}
          {{- if and .Values.sink (and .Values.sink.config (gt (len .Values.sink.config) 0)) }}
          {{- $envs = append $envs (dict "name" "RASTREO_SINK_CONFIG_PATH" "value" "/etc/rastreo/sink/sink.yaml") }}
          {{- if hasKey .Values.sink "probeIntervalSeconds" }}
          {{- $envs = append $envs (dict "name" "RASTREO_SINK_PROBE_INTERVAL_SECS" "value" (printf "%d" (int64 .Values.sink.probeIntervalSeconds))) }}
          {{- end }}
          {{- if hasKey .Values.sink "probeTimeoutSeconds" }}
          {{- $envs = append $envs (dict "name" "RASTREO_SINK_PROBE_TIMEOUT_SECS" "value" (printf "%d" (int64 .Values.sink.probeTimeoutSeconds))) }}
          {{- end }}
          {{- end }}
          {{- if .Values.otlp }}
          {{- if or .Values.otlp.metricsEnabled .Values.otlp.logsEnabled .Values.otlp.tracesEnabled }}
          {{- if not .Values.otlp.endpoint }}
          {{- fail "otlp.endpoint must be set when otlp.metricsEnabled, otlp.logsEnabled, or otlp.tracesEnabled is true" }}
          {{- end }}
          {{- $envs = append $envs (dict "name" "RASTREO_OTLP_ENDPOINT" "value" (printf "%v" .Values.otlp.endpoint)) }}
          {{- if .Values.otlp.protocol }}
          {{- $envs = append $envs (dict "name" "RASTREO_OTLP_PROTOCOL" "value" (printf "%v" .Values.otlp.protocol)) }}
          {{- end }}
          {{- if .Values.otlp.metricsEnabled }}
          {{- $envs = append $envs (dict "name" "RASTREO_OTLP_METRICS_ENABLED" "value" "true") }}
          {{- end }}
          {{- if .Values.otlp.logsEnabled }}
          {{- $envs = append $envs (dict "name" "RASTREO_OTLP_LOGS_ENABLED" "value" "true") }}
          {{- end }}
          {{- if .Values.otlp.tracesEnabled }}
          {{- $envs = append $envs (dict "name" "RASTREO_OTLP_TRACES_ENABLED" "value" "true") }}
          {{- end }}
          {{- if and .Values.otlp.metricsEnabled .Values.otlp.metricsIntervalSeconds }}
          {{- $envs = append $envs (dict "name" "RASTREO_OTLP_METRICS_INTERVAL_SECS" "value" (printf "%d" (int64 .Values.otlp.metricsIntervalSeconds))) }}
          {{- end }}
          {{- if .Values.otlp.serviceName }}
          {{- $envs = append $envs (dict "name" "RASTREO_OTLP_SERVICE_NAME" "value" (printf "%v" .Values.otlp.serviceName)) }}
          {{- end }}
          {{- if or .Values.otlp.headers .Values.otlp.headersExistingSecret }}
          {{- $otlpSecretName := .Values.otlp.headersExistingSecret | default (printf "%s-otlp" (include "rastreo.fullname" .)) }}
          {{- $envs = append $envs (dict "name" "RASTREO_OTLP_HEADERS" "valueFrom" (dict "secretKeyRef" (dict "name" $otlpSecretName "key" .Values.otlp.headersSecretKey))) }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- if .Values.auth.enabled }}
          {{- $secretName := "" }}
          {{- if .Values.auth.existingSecret }}
          {{- $secretName = .Values.auth.existingSecret }}
          {{- else if .Values.auth.token }}
          {{- $secretName = printf "%s-auth" (include "rastreo.fullname" .) }}
          {{- else }}
          {{- fail "auth.enabled is true but no token source is set: set auth.token to render a Secret, set auth.existingSecret to reference one, or set auth.enabled=false to run POST /scans unauthenticated (not recommended)" }}
          {{- end }}
          {{- $envs = append $envs (dict "name" "RASTREO_API_TOKEN" "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "key" .Values.auth.secretKey))) }}
          {{- else }}
          {{- $envs = append $envs (dict "name" "RASTREO_AUTH_DISABLED" "value" "true") }}
          {{- end }}
          {{- if $envs }}
          env:
            {{- toYaml $envs | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- $hasSinkConfig := and .Values.sink (and .Values.sink.config (gt (len .Values.sink.config) 0)) }}
          {{- if $hasSinkConfig }}
          volumeMounts:
            - name: sink-config
              mountPath: /etc/rastreo/sink
              readOnly: true
          {{- end }}
      {{- if $hasSinkConfig }}
      volumes:
        - name: sink-config
          configMap:
            name: {{ include "rastreo.fullname" . }}-sink
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
