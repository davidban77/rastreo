apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rastreo.fullname" . }}
  labels:
    {{- include "rastreo.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rastreo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rastreo.selectorLabels" . | nindent 8 }}
      {{- if .Values.config }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "rastreo.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.securityContext }}
          securityContext:
            {{- $ctx := deepCopy .Values.securityContext }}
            {{- if .Values.podSecurity.netRaw }}
            {{- $caps := (get $ctx "capabilities") | default (dict) }}
            {{- $add := (get $caps "add") | default (list) }}
            {{- $_ := set $caps "add" (append $add "NET_RAW") }}
            {{- $_ := set $ctx "capabilities" $caps }}
            {{- end }}
            {{- toYaml $ctx | nindent 12 }}
          {{- end }}
          args:
            - "--port"
            - {{ .Values.server.port | quote }}
            - "--bind"
            - {{ .Values.server.bind | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          {{- $envs := list }}
          {{- if hasKey .Values.readiness "maxInflightScans" }}
          {{- $envs = append $envs (dict "name" "RASTREO_MAX_INFLIGHT_SCANS" "value" (printf "%v" .Values.readiness.maxInflightScans)) }}
          {{- end }}
          {{- if hasKey .Values.readiness "sinkErrorQuarantineSeconds" }}
          {{- $envs = append $envs (dict "name" "RASTREO_SINK_ERROR_QUARANTINE_SECS" "value" (printf "%v" .Values.readiness.sinkErrorQuarantineSeconds)) }}
          {{- end }}
          {{- if hasKey .Values.readiness "scanErrorQuarantineSeconds" }}
          {{- $envs = append $envs (dict "name" "RASTREO_SCAN_ERROR_QUARANTINE_SECS" "value" (printf "%v" .Values.readiness.scanErrorQuarantineSeconds)) }}
          {{- end }}
          {{- if .Values.logFormat }}
          {{- $envs = append $envs (dict "name" "RASTREO_LOG_FORMAT" "value" (printf "%v" .Values.logFormat)) }}
          {{- end }}
          {{- if .Values.otlp }}
          {{- if or .Values.otlp.metricsEnabled .Values.otlp.logsEnabled }}
          {{- if not .Values.otlp.endpoint }}
          {{- fail "otlp.endpoint must be set when otlp.metricsEnabled or otlp.logsEnabled is true" }}
          {{- end }}
          {{- $envs = append $envs (dict "name" "RASTREO_OTLP_ENDPOINT" "value" (printf "%v" .Values.otlp.endpoint)) }}
          {{- if .Values.otlp.protocol }}
          {{- $envs = append $envs (dict "name" "RASTREO_OTLP_PROTOCOL" "value" (printf "%v" .Values.otlp.protocol)) }}
          {{- end }}
          {{- if .Values.otlp.metricsEnabled }}
          {{- $envs = append $envs (dict "name" "RASTREO_OTLP_METRICS_ENABLED" "value" "true") }}
          {{- end }}
          {{- if .Values.otlp.logsEnabled }}
          {{- $envs = append $envs (dict "name" "RASTREO_OTLP_LOGS_ENABLED" "value" "true") }}
          {{- end }}
          {{- if and .Values.otlp.metricsEnabled .Values.otlp.metricsIntervalSeconds }}
          {{- $envs = append $envs (dict "name" "RASTREO_OTLP_METRICS_INTERVAL_SECS" "value" (printf "%v" .Values.otlp.metricsIntervalSeconds)) }}
          {{- end }}
          {{- if .Values.otlp.serviceName }}
          {{- $envs = append $envs (dict "name" "RASTREO_OTLP_SERVICE_NAME" "value" (printf "%v" .Values.otlp.serviceName)) }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- if $envs }}
          env:
            {{- toYaml $envs | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.config }}
          volumeMounts:
            - name: config
              mountPath: /etc/rastreo
              readOnly: true
          {{- end }}
      {{- if .Values.config }}
      volumes:
        - name: config
          configMap:
            name: {{ include "rastreo.fullname" . }}-config
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
