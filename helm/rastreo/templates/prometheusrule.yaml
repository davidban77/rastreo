{{- if .Values.alerts.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "rastreo.fullname" . }}
  labels:
    {{- include "rastreo.labels" . | nindent 4 }}
    {{- with .Values.alerts.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: rastreo.rules
      interval: 60s
      rules:
        - alert: RastreoScanFailureRate
          expr: |
            (
              sum(rate(rastreo_server_probes_total{outcome="error"}[10m]))
              /
              clamp_min(sum(rate(rastreo_server_probes_total[10m])), 1)
            ) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "rastreo-server probe error rate exceeds 50% over 10 minutes"
            description: |
              More than half of all probes hit a fault over the last 10 minutes on
              {{ `{{ $labels.instance }}` }}. A probe fault means the probe could not
              run — a missing CAP_NET_RAW capability, a socket that fails to open, an
              address-family mismatch, or an undecodable reply. Targets that simply do
              not answer are not errors and do not raise this ratio, so this alert
              points at the rastreo deployment or the scenario, not at dark hosts.

        - alert: RastreoProbeErrorRatioPerKind
          expr: |
            (
              sum by (probe_kind) (rate(rastreo_server_probes_total{outcome="error"}[10m]))
              /
              clamp_min(sum by (probe_kind) (rate(rastreo_server_probes_total[10m])), 1)
            ) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "rastreo-server probe error rate exceeds 50% for a single probe kind"
            description: |
              More than half of the {{ `{{ $labels.probe_kind }}` }} probes hit a fault
              over the last 10 minutes on {{ `{{ $labels.instance }}` }}. One prober is
              faulting while the others are healthy — for example arp or ndp without
              CAP_NET_RAW. Check that prober's configuration and the capabilities the
              pod was granted.

        - alert: RastreoSinkErrorSpikePerClass
          expr: sum by (error_class) (rate(rastreo_server_sink_errors_total[5m])) > (1 / 60)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "rastreo-server sink error rate is above 1 per minute for a single class"
            description: |
              Sink error rate for class {{ `{{ $labels.error_class }}` }} exceeds
              1 per minute for 5+ consecutive minutes on
              {{ `{{ $labels.instance }}` }}. Check the sink configuration and
              downstream broker / topic availability. If DLQ is configured, DLQ
              traffic may also be elevated.

        - alert: RastreoDlqTrafficSurge
          expr: sum(rate(rastreo_server_dlq_records_total[5m])) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "rastreo-server dead-letter queue is receiving records"
            description: |
              DLQ delivery rate exceeds 0.1 records/sec for 5+ consecutive minutes
              on {{ `{{ $labels.instance }}` }}. Records are being quarantined —
              inspect the DLQ topic / stream, verify the primary destination is
              healthy, and drain the quarantine once the underlying issue is fixed.

        - alert: RastreoNoRecordsEmitted10min
          expr: |
            (increase(rastreo_server_records_emitted_total[10m]) == 0)
            and
            (sum without (outcome) (rate(rastreo_server_scans_total[10m])) > 0)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "rastreo-server has not emitted records for 10 minutes despite active scans"
            description: |
              No records have been emitted in the last 10 minutes on
              {{ `{{ $labels.instance }}` }}, yet scans are still running. Every probed
              target stayed silent, or the sink is dropping records. Check the target
              list, the port list, and the sink. The probe error ratios stay flat in
              this case, because a target that does not answer is not an error.

        - alert: RastreoSinkUnreachable
          expr: |
            max_over_time(rastreo_server_sink_reachable[2m]) == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "rastreo-server sink is unreachable"
            description: |
              The server-side reachability probe for sink type
              {{ `{{ $labels.sink_type }}` }} on {{ `{{ $labels.instance }}` }}
              has reported unreachable for at least 2 minutes. Records still flow
              via `POST /scans` response bodies, but downstream ingest is offline.
              Inspect broker / server connectivity, `/readyz`, and the
              `last_probe_error` field.

        - alert: RastreoSinkProbeStalled
          expr: |
            increase(rastreo_server_sink_probe_ticks_total[5m]) == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "rastreo-server sink probe task has stopped running"
            description: |
              The background sink reachability probe on
              {{ `{{ $labels.instance }}` }} has not started a cycle in 5 minutes.
              `rastreo_server_sink_reachable` is frozen at the value it last
              published and no longer says anything about sink type
              {{ `{{ $labels.sink_type }}` }}. /readyz reports the same state as
              `sink_probe_stalled`. Widen this range if
              RASTREO_SINK_PROBE_INTERVAL_SECS is longer than 5 minutes.

        - alert: RastreoBuildOld
          expr: |
            rastreo_server_uptime_seconds > {{ int .Values.alerts.buildAgeThresholdSeconds }}
          for: 1h
          labels:
            severity: info
          annotations:
            summary: "rastreo-server is running an old build"
            description: |
              rastreo-server has been running the same build for more than the
              configured age threshold. Version: {{ `{{ $labels.version }}` }}.
              Consider upgrading to pick up recent fixes and features.
{{- end }}
