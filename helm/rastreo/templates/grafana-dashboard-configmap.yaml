{{- if .Values.grafana.dashboardsEnabled -}}
{{- $lbl := .Values.grafana.dashboardLabel | default (dict) -}}
{{- $lblName := $lbl.name | default "grafana_dashboard" -}}
{{- $lblValue := $lbl.value | default "1" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rastreo.fullname" . }}-grafana-dashboard
  labels:
    {{- include "rastreo.labels" . | nindent 4 }}
    {{ $lblName }}: {{ $lblValue | quote }}
data:
  rastreo.json: |-
    {{- .Files.Get "dashboards/rastreo.json" | nindent 4 }}
{{- end }}
