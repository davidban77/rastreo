[project]
name = "nautobot-consumer"
version = "0.1.0"
description = "Reference consumer that upserts rastreo DeviceRecord events into Nautobot devices."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.6",
    "pynautobot>=2.6",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.26.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nautobot_consumer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits a live Nautobot instance; requires NAUTOBOT_URL and NAUTOBOT_TOKEN env vars.",
]
addopts = "-m 'not integration'"
