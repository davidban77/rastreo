site_name: rastreo
site_description: Enrichment-aware network discovery in Rust — active probes across many protocols fused into deduplicated DeviceRecord events on Kafka, file, or stdout.
site_url: https://davidban77.github.io/rastreo/
repo_url: https://github.com/davidban77/rastreo
repo_name: davidban77/rastreo
edit_uri: edit/main/docs/site/docs/

copyright: Copyright &copy; 2026 David Flores · Built with Material for MkDocs

theme:
  name: material
  language: en
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view
    - toc.follow

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  # auto_append injects shared abbreviation definitions into every page.
  # The includes/ partial sits outside docs/ so it is not published or indexed.
  - pymdownx.snippets:
      check_paths: true
      base_path:
        - docs/site/includes
        - .
      auto_append:
        - abbreviations.md
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/davidban77/rastreo
      name: rastreo on GitHub
  generator: false

extra_css:
  - assets/extra.css

nav:
  - Home: index.md
  - Get started:
      - get-started/index.md
      - Install: get-started/install.md
      - First scan: get-started/first-scan.md
  - Discover:
      - discover/index.md
      - Running scans: discover/cli.md
      - Catalog: discover/catalog.md
      - Validate: discover/validate.md
      - Targets: discover/targets.md
      - Sinks: discover/sinks.md
      - Enrichment: discover/enrichment.md
      - Identity: discover/identity.md
      - Classification: discover/classification.md
      - Topology: discover/topology.md
      - Collection profiles: discover/collection-profile.md
  - Probe:
      - probe/index.md
      - HTTP: probe/http.md
      - DNS: probe/dns.md
      - Reverse DNS: probe/reverse-dns.md
      - UDP: probe/udp.md
      - SNMP: probe/snmp.md
      - ARP: probe/arp.md
      - NDP: probe/ndp.md
      - SSH: probe/ssh.md
      - ICMP: probe/icmp.md
      - TLS: probe/tls.md
      - gNMI: probe/gnmi.md
      - LLDP: probe/lldp.md
  - Integrate:
      - integrate/index.md
      - Kafka: integrate/kafka.md
      - NATS: integrate/nats.md
      - Source of truth: integrate/source-of-truth.md
      - Reference consumers: integrate/reference-consumers.md
      - Troubleshooting: integrate/troubleshooting.md
  - Deploy:
      - deploy/index.md
      - Docker: deploy/docker.md
      - Kubernetes: deploy/kubernetes.md
      - Server: deploy/server.md
  - Reference:
      - reference/index.md
      - CLI reference: reference/cli.md
      - Configuration: reference/configuration.md
      - Scenario: reference/scenario.md
      - Secrets: reference/secrets.md
      - Schema:
          - reference/schema/index.md
          - DeviceRecord: reference/schema/device-record.md
          - LinkRecord: reference/schema/link-record.md
          - CollectionProfileRecord: reference/schema/collection-profile-record.md
          - ScanMetadata: reference/schema/scan-metadata.md
          - ScenarioFile: reference/schema/scenario-config.md
          - DiscoveryPlan: reference/schema/discovery-plan.md
          - Streaming API: reference/schema/streaming-api.md
          - DlqEnvelope: reference/schema/dlq-envelope.md
      - Errors: reference/errors.md
      - Health endpoints: reference/health-endpoints.md
      - Observability: reference/observability.md
      - Logging: reference/logging.md
      - OTLP: reference/otlp.md
      - Glossary: reference/glossary.md
      - Changelog: reference/changelog.md
