---
# Source: rastreo/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rastreo
  labels:
    helm.sh/chart: rastreo-{{VERSION}}
    app.kubernetes.io/name: rastreo
    app.kubernetes.io/instance: rastreo
    app.kubernetes.io/version: "{{VERSION}}"
    app.kubernetes.io/managed-by: Helm
automountServiceAccountToken: false
---
# Source: rastreo/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: rastreo
  labels:
    helm.sh/chart: rastreo-{{VERSION}}
    app.kubernetes.io/name: rastreo
    app.kubernetes.io/instance: rastreo
    app.kubernetes.io/version: "{{VERSION}}"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: rastreo
    app.kubernetes.io/instance: rastreo
---
# Source: rastreo/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rastreo
  labels:
    helm.sh/chart: rastreo-{{VERSION}}
    app.kubernetes.io/name: rastreo
    app.kubernetes.io/instance: rastreo
    app.kubernetes.io/version: "{{VERSION}}"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rastreo
      app.kubernetes.io/instance: rastreo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rastreo
        app.kubernetes.io/instance: rastreo
    spec:
      serviceAccountName: rastreo
      terminationGracePeriodSeconds: 75
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rastreo
          image: ghcr.io/davidban77/rastreo:{{VERSION}}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          args:
            - "--port"
            - "8080"
            - "--bind"
            - "0.0.0.0"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: RASTREO_MAX_RESULT_BYTES
              value: "33554432"
            - name: RASTREO_SCENARIO_LABEL_MAX_LENGTH
              value: "64"
            - name: RASTREO_MAX_TOTAL_HOSTS
              value: "262144"
            - name: RASTREO_MAX_BODY_BYTES
              value: "1048576"
            - name: RASTREO_API_TOKEN
              valueFrom:
                secretKeyRef:
                  key: api-token
                  name: rastreo-api-token
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
