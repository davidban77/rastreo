[package]
name = "rastreo-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["web-programming::http-server", "network-programming"]
description = "HTTP control plane for rastreo — enrichment-aware network discovery"
readme = "../README.md"

[features]
default = ["config"]
config = ["rastreo-core/config"]
http = ["rastreo-core/http"]
kafka = ["rastreo-core/kafka"]
nats = ["rastreo-core/nats"]
snmp = ["rastreo-core/snmp"]
arp = ["rastreo-core/arp"]
ndp = ["rastreo-core/ndp"]
mib_enrichment = ["rastreo-core/mib_enrichment"]
ssh = ["rastreo-core/ssh"]
icmp = ["rastreo-core/icmp"]
tls = ["rastreo-core/tls"]
gnmi = ["rastreo-core/gnmi"]
lldp = ["rastreo-core/lldp"]
otlp = [
  "rastreo-core/otlp",
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
]

[[bin]]
name = "rastreo-server"
path = "src/main.rs"

[lib]
name = "rastreo_server"
path = "src/lib.rs"

[dependencies]
rastreo-core = { workspace = true }
axum = "0.8"
ipnet = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["env"] }
async-trait = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
subtle = "2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "timeout"] }
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "logs", "metrics", "trace"], optional = true }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "http-proto", "reqwest-blocking-client", "metrics", "logs", "trace"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
hickory-resolver = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
opentelemetry_sdk = { version = "0.32", features = ["testing"] }
tempfile = { workspace = true }

[lints]
workspace = true
