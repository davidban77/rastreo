[package]
name = "rastreo-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["network-programming"]
description = "Core engine for rastreo — enrichment-aware network discovery library"
readme = "../README.md"

[features]
default = ["config"]
config = ["dep:serde_yaml_ng"]
http = ["dep:reqwest", "dep:rustls"]
kafka = ["dep:rskafka", "chrono/clock", "dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots"]
snmp = [
    "dep:rasn",
    "dep:rasn-snmp",
    "dep:rasn-smi",
    "dep:digest",
    "dep:hmac",
    "dep:md-5",
    "dep:sha1",
    "dep:aes",
    "dep:cbc",
    "dep:cfb-mode",
    "dep:des",
]
arp = ["dep:pnet_datalink", "dep:pnet_packet", "dep:ipnetwork"]
ndp = ["dep:pnet_datalink", "dep:pnet_packet", "dep:ipnetwork"]
nats = ["dep:async-nats", "dep:bytes", "chrono/clock"]
oui = ["dep:flate2"]
ssh = ["dep:russh"]
icmp = ["dep:socket2", "dep:pnet_packet"]
tls = ["dep:rustls", "dep:rustls-pki-types", "dep:tokio-rustls", "dep:x509-parser"]

[dependencies]
serde = { workspace = true }
serde_yaml_ng = { workspace = true, optional = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
hickory-resolver = { workspace = true }
ipnet = { workspace = true }
schemars = { workspace = true }
ulid = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"], optional = true }
rskafka = { workspace = true, optional = true }
chrono = { workspace = true }
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
rasn = { version = "0.28", default-features = false, optional = true }
rasn-snmp = { version = "0.28", optional = true }
rasn-smi = { version = "0.28", optional = true }
digest = { version = "0.11", optional = true }
hmac = { version = "0.13", optional = true }
md-5 = { version = "0.11", optional = true }
sha1 = { version = "0.11", optional = true }
aes = { version = "0.9", optional = true }
cbc = { version = "0.2", optional = true, features = ["alloc", "block-padding"] }
cfb-mode = { version = "0.9", optional = true }
des = { version = "0.9", optional = true }
pnet_datalink = { version = "0.35", default-features = false, features = ["std"], optional = true }
pnet_packet = { version = "0.35", optional = true }
ipnetwork = { version = "0.20", optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
async-nats = { version = "0.49", default-features = false, features = ["ring", "jetstream", "nkeys"], optional = true }
bytes = { version = "1", optional = true }
russh = { version = "0.62", default-features = false, features = ["ring", "rsa"], optional = true }
socket2 = { version = "0.6", features = ["all"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
x509-parser = { version = "0.16", default-features = false, optional = true }

[dev-dependencies]
insta = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

[lints]
workspace = true
