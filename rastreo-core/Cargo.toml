[package]
name = "rastreo-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["network-programming"]
description = "Core engine for rastreo — enrichment-aware network discovery library"
readme = "../README.md"

[features]
default = ["config"]
config = ["dep:serde_yaml_ng"]
http = ["dep:reqwest", "dep:rustls"]
kafka = ["dep:rskafka", "chrono/clock", "dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots"]
snmp = [
    "dep:rasn",
    "dep:rasn-snmp",
    "dep:rasn-smi",
    "dep:digest",
    "dep:hmac",
    "dep:md-5",
    "dep:sha1",
    "dep:aes",
    "dep:cbc",
    "dep:cfb-mode",
    "dep:des",
]
lldp = ["snmp"]
arp = ["dep:pnet_datalink", "dep:pnet_packet", "dep:ipnetwork", "dep:socket2", "dep:caps"]
ndp = ["dep:pnet_datalink", "dep:pnet_packet", "dep:ipnetwork", "dep:socket2", "dep:caps"]
nats = ["dep:async-nats", "dep:bytes", "chrono/clock"]
oui = ["dep:flate2"]
ssh = ["dep:russh"]
icmp = ["dep:socket2", "dep:pnet_packet", "dep:caps"]
tls = ["dep:rustls", "dep:rustls-pki-types", "dep:tokio-rustls", "dep:x509-parser"]
gnmi = ["dep:tonic", "dep:tonic-prost", "dep:prost", "dep:prost-types", "dep:rustls"]
otlp = [
    "dep:anyhow",
    "dep:tracing-subscriber",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-appender-tracing",
    "dep:tracing-opentelemetry",
]

[dependencies]
serde = { workspace = true, features = ["rc"] }
serde_yaml_ng = { workspace = true, optional = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
hickory-resolver = { workspace = true }
ipnet = { workspace = true }
schemars = { workspace = true }
ulid = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"], optional = true }
rskafka = { workspace = true, optional = true }
chrono = { workspace = true }
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
rasn = { version = "0.28", default-features = false, optional = true }
rasn-snmp = { version = "0.28", optional = true }
rasn-smi = { version = "0.28", optional = true }
digest = { version = "0.11", optional = true }
hmac = { version = "0.13", optional = true }
md-5 = { version = "0.11", optional = true }
sha1 = { version = "0.11", optional = true }
aes = { version = "0.9", optional = true }
cbc = { version = "0.2", optional = true, features = ["alloc", "block-padding"] }
cfb-mode = { version = "0.9", optional = true }
des = { version = "0.9", optional = true }
pnet_datalink = { version = "0.35", default-features = false, features = ["std"], optional = true }
pnet_packet = { version = "0.35", optional = true }
ipnetwork = { version = "0.20", optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
async-nats = { version = "0.49", default-features = false, features = ["ring", "jetstream", "nkeys"], optional = true }
bytes = { version = "1", optional = true }
russh = { version = "0.62", default-features = false, features = ["ring", "rsa"], optional = true }
socket2 = { version = "0.6", features = ["all"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
x509-parser = { version = "0.18", default-features = false, optional = true }
tonic = { version = "0.14", default-features = false, features = ["channel", "tls-ring", "codegen"], optional = true }
tonic-prost = { version = "0.14", default-features = false, optional = true }
prost = { version = "0.14", optional = true }
prost-types = { version = "0.14", optional = true }
anyhow = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["json"], optional = true }
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "logs", "metrics", "trace"], optional = true }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "http-proto", "reqwest-blocking-client", "logs", "trace"], optional = true }
opentelemetry-appender-tracing = { version = "0.32", optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
caps = { version = "0.5.6", optional = true }

[dev-dependencies]
insta = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["kafka", "nats"] }
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "logs", "metrics", "trace", "testing"] }
tracing-opentelemetry = "0.33"
tracing-subscriber = { workspace = true, features = ["json"] }
serde_json = { workspace = true }

[lints]
workspace = true
