name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

  test-kafka-http:
    name: Test with kafka + http features
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test with kafka + http features
        run: cargo test --workspace --features kafka,http

  test-all-features:
    name: Test with all features (kafka,http,snmp,arp,ndp,nats,ssh,icmp,tls)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test with kafka,http,snmp,arp,ndp,nats,ssh,icmp,tls,otlp features
        run: cargo test --workspace --features kafka,http,snmp,arp,ndp,nats,ssh,icmp,tls,otlp

  integration:
    name: Integration tests (Kafka + NATS via testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Kafka + NATS integration tests
        run: cargo test -p rastreo-core --features kafka,nats --test kafka_integration --test nats_integration -- --ignored

      - name: Run NATS sink tests that stand up a broker
        run: cargo test -p rastreo-core --features nats --lib -- --ignored

  schema-drift:
    name: Schema drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Regenerate schemas
        run: cargo run -p xtask -- generate

      - name: Render docs
        run: cargo run -p xtask -- render

      - name: Verify no drift
        run: |
          if ! git diff --exit-code schemas/ docs/site/docs/schemas/ docs/site/docs/reference/schema/; then
            echo "::error::Committed schemas or rendered docs are out of sync with the Rust type derives."
            echo "Run \`task schema:all\` locally and commit the result."
            exit 1
          fi

  test-no-default-features:
    name: Test rastreo-core without default features
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2.86.8
        with:
          tool: cargo-hack

      - name: Test rastreo-core with each feature in isolation
        run: cargo hack --each-feature test -p rastreo-core

      # Running (not just building) is what exercises the feature-absent branches: the
      # rebuild-hint assertions are vacuous on a build that carries every prober.
      - name: Test the rastreo CLI without default features
        run: cargo test -p rastreo --no-default-features

  msrv:
    name: MSRV (rust-version) check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check the workspace on the declared MSRV
        run: cargo check --workspace --all-features

  consumers:
    name: Reference consumers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consumer: [infrahub-consumer, nautobot-consumer, netbox-consumer]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run consumer unit tests
        working-directory: examples/${{ matrix.consumer }}
        run: uv run pytest

  live-uat-self-test:
    name: Live UAT harness self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Stdlib-only and Docker-free: the structural guards (readiness coverage,
      # gate/endpoint reconciliation, budget vs. job timeout) block here rather
      # than only when someone runs the flag by hand.
      - name: Run the live-infra UAT harness self-tests
        run: python3 scripts/live_infra_uat.py --self-test

  helm-chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.15.2

      - name: Lint chart
        run: helm lint --strict helm/rastreo

      # The release workflow only lints, which never renders a manifest. These
      # tests render and assert, so a values combination the chart must refuse
      # blocks here rather than on someone's cluster.
      - name: Render the chart and assert on the output
        run: python3 scripts/helm_chart_test.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Every other job runs bare cargo, which rewrites a drifted lock instead of failing on it.
      - name: Lockfile in sync with manifests
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2.86.8
        with:
          tool: cargo-hack

      # `cargo clippy --workspace` sees whatever xtask pulls in — 12 of rastreo-core's 14
      # features, all at once. `mib_enrichment` and `otlp` are never linted, and an
      # everything-on build is the one shape where a lint on a feature-gated type can go
      # quiet: two large enum variants hide each other. This lints every feature at least
      # once on its own. It does not lint pairs.
      - name: Clippy every crate with each feature in isolation
        run: cargo hack --each-feature --workspace clippy --all-targets -- -D warnings
