name: Build & Push :main Docker Image

# Publishes ghcr.io/davidban77/rastreo:main (and :main-otlp) on every push to
# main. Gives the lab-validation harness and other continuous-integration
# consumers a way to pin against the freshest features without waiting for a
# tagged release.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-main-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  docker-main:
    name: Build & Push :main ${{ matrix.variant.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: default
            features: kafka,http,snmp,arp,ndp,oui,nats,ssh,icmp,tls
            suffix: ""
          - name: otlp
            features: kafka,http,snmp,arp,ndp,oui,nats,ssh,icmp,tls,otlp
            suffix: "-otlp"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=${{ matrix.variant.suffix }},onlatest=true
          tags: |
            type=raw,value=main

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            FEATURES=${{ matrix.variant.features }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=main-${{ matrix.variant.name }}
          cache-to: type=gha,mode=max,scope=main-${{ matrix.variant.name }}
