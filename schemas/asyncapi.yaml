asyncapi: 3.0.0

info:
  title: rastreo discovery streaming API
  version: v1
  description: |
    Transport-neutral description of the rastreo discovery streaming API.
    Every scan emits one `DeviceRecord` message per discovered device onto a
    versioned topic (Kafka) or subject (NATS), one `LinkRecord` message per
    deduplicated topology link onto a separate versioned channel, and one
    `CollectionProfileRecord` message per gNMI endpoint that advertised
    capability data onto a third channel. The wire payload is the same JSON
    Schema (`schemas/device-record-v1.json`, `schemas/link-record-v1.json`,
    `schemas/collection-profile-record-v1.json`) regardless of transport;
    consumers can validate incoming records against the URL embedded in each
    record's `schema_id` field.
  license:
    name: MIT OR Apache-2.0

defaultContentType: application/json

servers:
  kafka:
    host: kafka:9092
    protocol: kafka
    description: |
      Kafka broker(s) advertised to rastreo via `--kafka-brokers` or the
      `RASTREO_KAFKA_BROKERS` environment variable. The default lab stack
      exposes `kafka:9092` on the docker-compose network.
  nats:
    host: nats:4222
    protocol: nats
    description: |
      NATS server(s) advertised to rastreo via `--nats-url` or the
      `RASTREO_NATS_URL` environment variable. The default lab stack
      exposes `nats:4222` on the docker-compose network.

channels:
  discoveryRecords:
    address: rastreo.discovery.records.v1
    title: DeviceRecord stream
    description: |
      Discovered device records, one message per fused `DeviceRecord`.
      Batched flush / delivery modes optimise the network round-trip only;
      they never combine records, so every message carries exactly one
      `DeviceRecord`. The channel address is used verbatim as the Kafka
      topic name and as the NATS subject. The `v1` suffix pins the wire
      schema; a breaking change ships a new channel
      (`rastreo.discovery.records.v2`) and both run in parallel for one
      release cycle.
    servers:
      - $ref: '#/servers/kafka'
      - $ref: '#/servers/nats'
    messages:
      deviceRecord:
        $ref: '#/components/messages/deviceRecord'

  discoveryLinks:
    address: rastreo.discovery.links.v1
    title: LinkRecord stream
    description: |
      Deduplicated topology edges, one message per physical link discovered
      via LLDP. Both directions of a link collapse to a single `LinkRecord`
      keyed by the unordered pair of chassis-ids. The channel address is used
      verbatim as the Kafka topic name (`links_topic`) and the NATS subject
      (`links_subject`). The `v1` suffix pins the wire schema; a breaking
      change ships a new channel (`rastreo.discovery.links.v2`) and both run
      in parallel for one release cycle.
    servers:
      - $ref: '#/servers/kafka'
      - $ref: '#/servers/nats'
    messages:
      linkRecord:
        $ref: '#/components/messages/linkRecord'

  discoveryProfiles:
    address: rastreo.discovery.profiles.v1
    title: CollectionProfileRecord stream
    description: |
      Collection profiles, one message per gNMI endpoint that answered with
      capability data. Each profile describes how to collect telemetry from an
      endpoint (transport, encoding, advertised models); a device with two
      management endpoints emits two profiles sharing an `identity_key`. The
      channel address is used verbatim as the Kafka topic name (`profiles_topic`)
      and the NATS subject (`profiles_subject`). The `v1` suffix pins the wire
      schema; a breaking change ships a new channel
      (`rastreo.discovery.profiles.v2`) and both run in parallel for one release
      cycle.
    servers:
      - $ref: '#/servers/kafka'
      - $ref: '#/servers/nats'
    messages:
      collectionProfileRecord:
        $ref: '#/components/messages/collectionProfileRecord'

  deadLetterRecords:
    address: rastreo.discovery.dlq.v1
    title: Dead-letter DeviceRecord stream
    description: |
      Records rastreo could not deliver to the primary channel and
      quarantined to the operator-configured dead-letter destination.
      The address here is illustrative — the real topic (Kafka) or
      subject (NATS) is whatever the sink's `dead_letter` config names.
      Each message payload is one unmodified `DeviceRecord`; the failure
      reason travels in the `x-rastreo-error-class` header so consumers
      can triage without parsing the payload. A consumer typically
      re-publishes the payload to the primary channel once the underlying
      issue is resolved.
    servers:
      - $ref: '#/servers/kafka'
      - $ref: '#/servers/nats'
    messages:
      deadLetterRecord:
        $ref: '#/components/messages/deadLetterRecord'

operations:
  emitDiscoveryRecord:
    action: send
    channel:
      $ref: '#/channels/discoveryRecords'
    summary: Emit a single fused DeviceRecord.
    description: |
      rastreo emits one message per unique device fused during a scan.
      Consumers should key correlation off `scan_metadata.scan_id` (a
      ULID) to reconstruct per-scan batches.
    messages:
      - $ref: '#/channels/discoveryRecords/messages/deviceRecord'

  emitDiscoveryLink:
    action: send
    channel:
      $ref: '#/channels/discoveryLinks'
    summary: Emit a single deduplicated topology link.
    description: |
      After every device record from a scan is emitted, rastreo flushes one
      message per discovered link. Consumers key correlation off
      `scan_metadata.scan_id` to align links with the device records from the
      same scan.
    messages:
      - $ref: '#/channels/discoveryLinks/messages/linkRecord'

  emitCollectionProfile:
    action: send
    channel:
      $ref: '#/channels/discoveryProfiles'
    summary: Emit a single collection profile for a gNMI endpoint.
    description: |
      After every device record and link from a scan is emitted, rastreo flushes
      one message per gNMI endpoint that advertised capability data. Consumers key
      correlation off `scan_metadata.scan_id` to align profiles with the device
      records from the same scan, and off `identity_key` to attach a profile to
      its device.
    messages:
      - $ref: '#/channels/discoveryProfiles/messages/collectionProfileRecord'

  quarantineDiscoveryRecord:
    action: send
    channel:
      $ref: '#/channels/deadLetterRecords'
    summary: Quarantine a DeviceRecord that failed primary delivery.
    description: |
      When primary delivery fails and a dead-letter destination is
      configured, rastreo ships the record there and reports success.
      The `x-rastreo-error-class` header names the failure class.
    messages:
      - $ref: '#/channels/deadLetterRecords/messages/deadLetterRecord'

components:
  messages:
    deviceRecord:
      name: DeviceRecord
      title: DeviceRecord
      summary: A single fused, deduplicated device observation.
      contentType: application/json
      payload:
        $ref: './device-record-v1.json'
      correlationId:
        location: $message.payload#/scan_metadata/scan_id
        description: |
          ULID stamped per scan. Consumers use it to group messages
          belonging to the same scan into a single batch.

    linkRecord:
      name: LinkRecord
      title: LinkRecord
      summary: A single deduplicated topology edge between two endpoints.
      contentType: application/json
      payload:
        $ref: './link-record-v1.json'
      correlationId:
        location: $message.payload#/scan_metadata/scan_id
        description: |
          ULID stamped per scan, identical to the device-record stream.
          Consumers use it to correlate links with the devices from the
          same scan.

    collectionProfileRecord:
      name: CollectionProfileRecord
      title: CollectionProfileRecord
      summary: A single collection profile describing how to collect telemetry from an endpoint.
      contentType: application/json
      payload:
        $ref: './collection-profile-record-v1.json'
      correlationId:
        location: $message.payload#/scan_metadata/scan_id
        description: |
          ULID stamped per scan, identical to the device-record stream.
          Consumers use it to correlate profiles with the devices from the
          same scan.

    deadLetterRecord:
      name: DeadLetterRecord
      title: DeadLetterRecord
      summary: A DeviceRecord quarantined after primary delivery failed.
      contentType: application/json
      payload:
        $ref: './device-record-v1.json'
      headers:
        $ref: './dlq-envelope-v1.json#/properties/headers'
      correlationId:
        location: $message.payload#/scan_metadata/scan_id
        description: |
          ULID stamped per scan, identical to the primary-channel
          message. Consumers use it to correlate a quarantined record
          back to its originating scan.
