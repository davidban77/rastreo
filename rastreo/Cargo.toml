[package]
name = "rastreo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "network-programming"]
description = "CLI for rastreo — enrichment-aware network discovery"
readme = "../README.md"

[features]
default = ["config"]
config = ["rastreo-core/config"]
http = ["rastreo-core/http"]
kafka = ["rastreo-core/kafka"]
nats = ["rastreo-core/nats"]
snmp = ["rastreo-core/snmp"]
arp = ["rastreo-core/arp"]
ndp = ["rastreo-core/ndp"]
oui = ["rastreo-core/oui"]
ssh = ["rastreo-core/ssh"]
icmp = ["rastreo-core/icmp"]
tls = ["rastreo-core/tls"]
otlp = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry-appender-tracing",
]

[[bin]]
name = "rastreo"
path = "src/main.rs"

[dependencies]
rastreo-core = { workspace = true }
clap = { workspace = true, features = ["env"] }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
ipnet = { workspace = true }
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "logs"], optional = true }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "logs"], optional = true }
opentelemetry-appender-tracing = { version = "0.32", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
