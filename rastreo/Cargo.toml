[package]
name = "rastreo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "network-programming"]
description = "CLI for rastreo — enrichment-aware network discovery"
readme = "../README.md"

[features]
default = ["config"]
config = ["rastreo-core/config"]
http = ["rastreo-core/http"]
kafka = ["rastreo-core/kafka"]
nats = ["rastreo-core/nats"]
snmp = ["rastreo-core/snmp"]
arp = ["rastreo-core/arp"]
ndp = ["rastreo-core/ndp"]
oui = ["rastreo-core/oui"]
mib_enrichment = ["rastreo-core/mib_enrichment"]
ssh = ["rastreo-core/ssh"]
icmp = ["rastreo-core/icmp"]
tls = ["rastreo-core/tls"]
gnmi = ["rastreo-core/gnmi"]
lldp = ["rastreo-core/lldp"]
otlp = ["rastreo-core/otlp"]

[[bin]]
name = "rastreo"
path = "src/main.rs"

[dependencies]
rastreo-core = { workspace = true }
clap = { workspace = true, features = ["env"] }
anyhow = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
ipnet = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
