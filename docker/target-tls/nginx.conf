worker_processes 1;
events { worker_connections 128; }
http {
    server {
        listen 443 ssl;
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / {
            return 200 "rastreo uat tls target\n";
        }
    }
}
